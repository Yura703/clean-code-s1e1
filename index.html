<!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
    <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
  </head>
  <body class="body">
    <header class="header">
      <img src="./eisenhower-matrix.jpg" class="header__img">
      <a class="header__link" 
        href="https://goal-life.com/page/method/matrix-eisenhower">
        Want more details?
      </a>
    </header>
    <main class="main">
      <section class="add-item">
        <p id="topSectionForAddingElementToList">
          <label for="new-task" class="new-task__label">Add Item</label>
          <div class="new-task__wrapper">
            <input id="new-task" class="task" type="text">
            <button class="button new-task__button">Add</button>
          </div>
        </p>
      </section>
      <section class="todo">
        <h3 class="title">Todo</h3>
        <ul class="incomplete-tasks" id="incomplete-tasks">
          <li class="item">
            <input class="check-item" type="checkbox">
            <label class="task">Pay Bills</label>
            <input type="text" class="task">
            <button class="button button__edit">Edit</button>
            <button class="button button__delete">
              <img src="./remove.svg">
            </button>
          </li>
          <li class=" item edit-mode">
            <input class="check-item" type="checkbox">
            <label class="task">Go Shopping</label>
            <input type="text" value="Go Shopping" class="task">
            <button class="button button__edit">Save</button>
            <button class="button button__delete">
              <img src="./remove.svg">
            </button>
          </li>
        </ul>
      </section>
      <section class="completed">
        <h3 class="title">Completed</h3>
        <ul class="completed-tasks" id="completed-tasks">
          <li class="item">
            <input class="check-item" type="checkbox" checked>
            <label class="task">See the Doctor</label>
            <input type="text" class="task">
            <button class="button button__edit">Edit</button>
            <button class="button button__delete">
              <img src="./remove.svg">
            </button>
          </li>
        </ul>
      </section>      
    </main>
    <script src="app.js"></script>
  </body>
</html>
